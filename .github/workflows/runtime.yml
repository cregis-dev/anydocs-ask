name: Build shared Ask runtime
on:
  pull_request:
    branches: [main]
    paths: ['Dockerfile*', 'docker/**', 'src/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'README.md', 'CHANGELOG.md', 'PRD.md', 'ARCHITECTURE.md', '.github/workflows/runtime.yml']
  push:
    branches: [main]
    paths: ['Dockerfile*', 'docker/**', 'src/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig*.json', 'vite.config.ts', 'README.md', 'CHANGELOG.md', 'PRD.md', 'ARCHITECTURE.md', '.github/workflows/runtime.yml']
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: node --test docker/check-content.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: bge-runtime
          platforms: linux/amd64
          build-args: ENGINE_REVISION=${{ github.sha }}
          tags: ghcr.io/cregis-dev/anydocs-ask-runtime:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=ask-runtime
          cache-to: type=gha,scope=ask-runtime,mode=max
      - name: Verify and publish the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/cregis-dev/anydocs-ask-runtime:$GITHUB_SHA"
          docker run --rm --network none --entrypoint sh "$image" -ec 'test ! -e /docs/anydocs.config.json && test -s /app/check-content.mjs && node dist/cli.js --help >/dev/null'
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker push "$image"
            docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          fi
